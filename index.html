<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Բառաքարտեր</title>
  <meta name="description" content="English–Armenian vocabulary flashcards: flip cards, hear pronunciation, track what you know.">
  <meta name="theme-color" content="#F4F5F1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Serif+Armenian:wght@500;600&family=Noto+Sans+Armenian:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <nav class="tabs" role="tablist" aria-label="Բաժիններ">
      <button class="tab active" data-tab="study" role="tab" aria-selected="true">Ուսուցում</button>
      <button class="tab" data-tab="list" role="tab" aria-selected="false">Իմ բառերը</button>
    </nav>
  </header>

  <div class="stats-row">
    <div class="stat"><span class="stat-num" id="statTotal">0</span><span class="stat-label">Ընդամենը</span></div>
    <div class="stat stat-new"><span class="stat-num" id="statNew">0</span><span class="stat-label">Նոր</span></div>
    <div class="stat stat-review"><span class="stat-num" id="statReview">0</span><span class="stat-label">Կրկնվող</span></div>
    <div class="stat stat-good"><span class="stat-num" id="statGood">0</span><span class="stat-label">Գիտեմ</span></div>
  </div>

  <main>
    <section id="studyView" class="view">
      <div class="filter-row" id="studyFilters">
        <button class="chip active" data-sf="learn">Չսովորվածը</button>
        <button class="chip" data-sf="all">Բոլորը</button>
      </div>

      <div id="studyEmpty" class="empty" hidden></div>

      <div id="studyDeck" hidden>
        <div class="deck-nav">
          <button id="prevBtn" class="nav-arrow" aria-label="Նախորդ քարտը">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="counter"><span id="counterCur">1</span> / <span id="counterTotal">1</span></div>
          <button id="nextBtn" class="nav-arrow" aria-label="Հաջորդ քարտը">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

        <div class="card-wrap">
          <span class="status-chip" id="cardStatusChip"></span>
          <span class="pos-badge" id="posBadge" hidden></span>
          <div class="flash-card" id="flashCard" tabindex="0" role="button" aria-label="Դարձրու՛ քարտը">
            <div class="card-inner">
              <div class="face face-front">
                <span class="face-lang">ՀԱՅ</span>
                <div class="face-word" id="wordAm"></div>
                <div class="face-context" id="contextAm" hidden></div>
              </div>
              <div class="face face-back">
                <span class="face-lang">EN</span>
                <div class="speak-row">
                  <div class="face-word" id="wordEn" lang="en"></div>
                  <button type="button" class="speak-btn" id="speakBtn" aria-label="Pronounce the English word" title="Listen (S)">🔊</button>
                </div>
                <div class="face-context" id="contextEn" hidden></div>
              </div>
            </div>
          </div>
        </div>

        <div class="grade-row">
          <button class="grade-btn grade-review" id="reviewBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/></svg>
            Կրկնել
          </button>
          <button class="grade-btn grade-good" id="gotItBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            Գիտեմ
          </button>
        </div>
      </div>

      <div id="sessionComplete" class="session-complete" hidden>
        <p class="sc-title">Այս շրջանն ավարտվեց</p>
        <p class="sc-sub" id="scSummary"></p>
        <button id="restartBtn" class="btn-primary">Սկսել նորից</button>
      </div>
    </section>

    <section id="listView" class="view" hidden>
      <div class="filter-row" id="listFilters">
        <button class="chip active" data-lf="all">Բոլորը</button>
        <button class="chip" data-lf="new">Նոր</button>
        <button class="chip" data-lf="review">Կրկնվող</button>
        <button class="chip" data-lf="got_it">Գիտեմ</button>
      </div>
      <ul class="word-list" id="wordList"></ul>
      <div id="listEmpty" class="empty" hidden>Այս բաժնում բառեր չկան։</div>

      <div class="list-footer" id="listFooter">
        <p class="storage-note" id="storageNote">Բառերը պահվում են միայն այս սարքում՝ այս բրաուզերում։</p>
        <button type="button" class="link-btn" id="resetBtn">Վերականգնել սկզբնական ցանկը</button>
      </div>
    </section>
  </main>

  <button id="addFab" class="fab" aria-label="Ավելացնել նոր բառ">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div id="wordSheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle">Նոր բառ</h2>
      <label for="inputEn">Անգլերեն</label>
      <input id="inputEn" type="text" placeholder="օր.՝ butterfly" autocomplete="off" lang="en">
      <label for="inputAm">Հայերեն</label>
      <input id="inputAm" type="text" placeholder="օր.՝ թիթեռ" autocomplete="off">
      <label for="inputContext">Համատեքստ (ընտրական)</label>
      <input id="inputContext" type="text" placeholder="օր.՝ A colorful insect" autocomplete="off">
      <label for="inputPos">Խոսքի մասը (ընտրական)</label>
      <select id="inputPos">
        <option value="">Ընտրել...</option>
        <option value="Գոյական">Գոյական (Noun)</option>
        <option value="Դերանուն">Դերանուն (Pronoun)</option>
        <option value="Բայ">Բայ (Verb)</option>
        <option value="Ածական">Ածական (Adjective)</option>
        <option value="Մակբայ">Մակբայ (Adverb)</option>
        <option value="Թվական">Թվական (Numeral)</option>
        <option value="Կապ">Կապ (Preposition)</option>
        <option value="Շաղկապ">Շաղկապ (Conjunction)</option>
        <option value="Վերաբերական">Վերաբերական (Particle)</option>
        <option value="Ձայնարկություն">Ձայնարկություն (Interjection)</option>
      </select>
      <div class="sheet-actions">
        <button id="cancelSheet" class="btn-secondary" type="button">Չեղարկել</button>
        <button id="saveSheet" class="btn-primary" type="button">Ավելացնել</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="app.js"></script>
</body>
</html>
